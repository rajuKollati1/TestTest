apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx01
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx01
  template:
    metadata:
      labels:
        app: nginx01
    spec:
      containers:
      - name: nginx01
        image: nginx:1.30.3
        ports:
        - containerPort: 80
