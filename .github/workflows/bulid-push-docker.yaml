name: Docker Build and Push to Docker Hub

on:
  workflow_dispatch: # Manual trigger from GitHub UI
  # Uncomment below if you want auto-builds on push to main
  # push:
  #   branches:
  #     - main

jobs:
  build_and_push:
    # Runs on your self-hosted Windows runner
    runs-on: [self-hosted, windows]

    env:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_USERNAME }} # e.g. 'rajuprudhvi'
      IMAGE_NAME: Raju-app
      DOCKER_TAG: ${{ github.sha }} # Unique tag per commit

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🔑 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          logout: true

      - name: 🔨 Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/Medicalshop/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.DOCKER_TAG }}
            ${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
